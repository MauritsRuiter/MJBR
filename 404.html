<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>404 | Page not found</title>
  </head>
  <body>
    <main class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-black px-6 text-center text-white font-[Gilroy]">
      <div class="pointer-events-none absolute inset-x-0 top-1/2 h-px -translate-y-1/2 bg-white/10"></div>
      <div class="relative flex flex-col items-center">
        <p class="mb-3 text-xs tracking-[0.3em] text-[#6A45FB] uppercase">
          Page not found
        </p>
        <p aria-hidden="true" class="select-none text-[clamp(9rem,32vw,24rem)] leading-[0.8] font-extrabold text-[#6A45FB]">
          404
        </p>
        <h1 class="mt-8 text-2xl font-bold sm:text-4xl">
          Looks like you've lost your way.
        </h1>
        <p class="mt-3 max-w-sm text-sm leading-6 text-white/60 sm:text-base">
          This page doesn't exist, or the link may be incorrect.
        </p>
        <a href="/" class="mt-8 inline-flex min-h-12 items-center gap-2 rounded-full border border-white/20 px-5 text-sm transition-colors hover:border-[#6A45FB] hover:bg-[#6A45FB] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#6A45FB]">
          <span aria-hidden="true">&larr;</span>
          Back to home
        </a>
      </div>
      <p class="absolute right-6 bottom-6 text-xs text-white/30">
        MAURITS RUITER <span class="mx-2 text-[#6A45FB]">/</span> 404
      </p>
    </main>
  </body>
</html>
